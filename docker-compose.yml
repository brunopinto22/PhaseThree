services:
  db:
    image: postgres:16-alpine
    container_name: phasethree_db
    env_file:
      - ./docker/env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    container_name: phasethree_backend
    env_file:
      - ./docker/env
    environment:
      DJANGO_SETTINGS_MODULE: gestor_estagios.settings
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    container_name: phasethree_web
    depends_on:
      - backend
    volumes:
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
  staticfiles:
  media:


